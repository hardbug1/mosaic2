<title>모자이크 — 2분기 제품 회고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..200&display=block">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); overflow: hidden; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 9999px; border: 3px solid var(--md-sys-color-surface); }
  ::-webkit-scrollbar-track { background: transparent; }
  button { font-family: var(--md-sys-typescale-plain-font); }
  @keyframes slideIn { from { transform: translateX(24px); opacity: 0.4; } to { transform: translateX(0); opacity: 1; } }

  /* ── Card tints — light + dark variants for readability in both themes ── */
  :root { --chip-bg: rgba(0,0,0,0.045); }
  [data-theme="dark"] { --chip-bg: rgba(255,255,255,0.07); }

  .tint-butter { --tint-bg: #FFF3D6; --tint-line: #EAD9A6; }
  .tint-blush  { --tint-bg: #FFE0E6; --tint-line: #F2C0CB; }
  .tint-lilac  { --tint-bg: #EADDFF; --tint-line: #D3C0F0; }
  .tint-mint   { --tint-bg: #D7F2E0; --tint-line: #B4DEC2; }
  .tint-sky    { --tint-bg: #D9ECFF; --tint-line: #B6D6F2; }
  .tint-paper  { --tint-bg: #FFFFFF; --tint-line: #E2DDE7; }

  /* Deep, desaturated tones so light card text stays readable on dark. */
  [data-theme="dark"] .tint-butter { --tint-bg: #3A3118; --tint-line: #564913; }
  [data-theme="dark"] .tint-blush  { --tint-bg: #3D2A2E; --tint-line: #5A3A40; }
  [data-theme="dark"] .tint-lilac  { --tint-bg: #2F2A40; --tint-line: #463E63; }
  [data-theme="dark"] .tint-mint   { --tint-bg: #1F3327; --tint-line: #2E4A39; }
  [data-theme="dark"] .tint-sky    { --tint-bg: #1B2E3E; --tint-line: #294257; }
  [data-theme="dark"] .tint-paper  { --tint-bg: #26242B; --tint-line: #46434C; }
</style>
